<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Onafhankelijk 1.400+ hondenvoeders van 50 merken vergelijken op allergenen, dierlijke bronnen en ingrediëntenlijsten." />
    <meta property="og:title" content="Hondenvoervergelijker — Onafhankelijk hondenvoer vergelijken op allergenen" />
    <meta property="og:description" content="Vind direct welk hondenvoer (brokken, natvoer en versvlees) vrij is van de allergenen van jouw hond op basis van officiële fabrikant-etiketten." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hondenvoervergelijker.paulzuiderduin.com/" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="canonical" href="https://hondenvoervergelijker.paulzuiderduin.com/" />
    <script>
      // Bij elke uitrol verdwijnen de oude bestanden van de site. Een browser die
      // nog een oude index.html bewaart (GitHub bewaart die tien minuten), vraagt
      // dan om een bestand dat niet meer bestaat: de pagina blijft wit. In dat
      // geval laden we één keer opnieuw; de tweede keer komt de nieuwe HTML wel.
      addEventListener('error', (gebeurtenis) => {
        const adres = gebeurtenis.target?.src || gebeurtenis.target?.href || ''
        if (!adres.includes('/assets/') || sessionStorage.getItem('hvv-herladen')) return
        sessionStorage.setItem('hvv-herladen', '1')
        location.reload()
      }, true)
      // Start de app wel, dan mag bij een volgende storing weer herladen worden.
      setTimeout(() => {
        if (document.getElementById('root')?.childElementCount) sessionStorage.removeItem('hvv-herladen')
      }, 5000)
    </script>
    <title>Hondenvoervergelijker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
