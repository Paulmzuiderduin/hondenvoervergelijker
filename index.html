    <script>
      // Bij elke uitrol verdwijnen de oude bestanden van de site. Een browser die
      // nog een oude index.html bewaart (GitHub bewaart die tien minuten), vraagt
      // dan om een bestand dat niet meer bestaat: de pagina blijft wit. In dat
      // geval laden we één keer opnieuw; de tweede keer komt de nieuwe HTML wel.
      addEventListener('error', (gebeurtenis) => {
        const adres = gebeurtenis.target?.src || gebeurtenis.target?.href || ''
        if (!adres.includes('/assets/') || sessionStorage.getItem('hvv-herladen')) return
        sessionStorage.setItem('hvv-herladen', '1')
        location.reload()
      }, true)
      // Start de app wel, dan mag bij een volgende storing weer herladen worden.
      setTimeout(() => {
        if (document.getElementById('root')?.childElementCount) sessionStorage.removeItem('hvv-herladen')
      }, 5000)
    </script>
