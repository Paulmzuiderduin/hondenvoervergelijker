name: Broncontrole

# Kijkt één keer per week of de bronpagina's van de geïmporteerde etiketten nog
# dezelfde tekst tonen. Verandert er iets, dan komt er een melding in een issue.
# De teksten op de site veranderen nooit vanzelf: een mens beslist wat er gebeurt.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      alleen_voeding:
        description: 'Sla de ingrediënten- en browsercontrole over'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: broncontrole
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Afhankelijkheden installeren (playwright-core voor de browsercontrole)
        run: npm ci
      - name: Bronpagina's vergelijken met de importbestanden
        id: vergelijken
        if: ${{ inputs.alleen_voeding != true }}
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BRONCONTROLE_TOKEN: ${{ secrets.BRONCONTROLE_TOKEN }}
        run: node scripts/controleer-bronnen.mjs --parallel=8 --pauze=1500
      - name: Geblokkeerde sites in een echte browser controleren
        id: browser
        if: ${{ inputs.alleen_voeding != true }}
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BRONCONTROLE_TOKEN: ${{ secrets.BRONCONTROLE_TOKEN }}
        run: node scripts/controleer-bronnen-browser.mjs --parallel=3 --pauze=2000
      - name: Voedingswaarden vergelijken met de importbestanden
        id: voeding
        continue-on-error: true
        run: node scripts/controleer-voedingswaarden-bronnen.mjs --parallel=6 --pauze=300
      - name: Voedingswaarden van geblokkeerde sites in een echte browser controleren
        id: voeding-browser
        continue-on-error: true
        run: node scripts/controleer-voedingswaarden-browser.mjs --parallel=3 --pauze=2000
      - name: Voedingswaarden op interne consistentie controleren
        id: plausibiliteit
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/controleer-voedingswaarden-plausibiliteit.mjs
      - name: Database-back-up maken
        if: always()
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/maak-backup.mjs
      - name: Melding maken of bijwerken
        if: steps.vergelijken.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.voeding.outcome == 'failure' || steps.voeding-browser.outcome == 'failure' || steps.plausibiliteit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Broncontrole vindt aandachtspunten"
          melding=melding.md
          {
            if [ -f data/import/broncontrole.md ]; then
              sed '/^Onveranderd:/,$d' data/import/broncontrole.md
            fi
            if [ -f data/import/broncontrole-browser.md ]; then
              echo ''
              cat data/import/broncontrole-browser.md
            fi
            if [ -f data/import/voedingswaarden/broncontrole.md ]; then
              echo ''
              cat data/import/voedingswaarden/broncontrole.md
            fi
            if [ -f data/import/voedingswaarden/broncontrole-browser.md ]; then
              echo ''
              cat data/import/voedingswaarden/broncontrole-browser.md
            fi
            if [ -f data/import/voedingswaarden/plausibiliteit.md ]; then
              echo ''
              cat data/import/voedingswaarden/plausibiliteit.md
            fi
            echo ''
            echo '---'
            echo "Actielog: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ''
            echo 'De tekst op de site is niet veranderd. Kijk per product of de fabrikant het etiket'
            echo 'heeft aangepast; pas daarna de import of het product in Beheer aan.'
          } > "$melding"
          bestaand=$(gh issue list --state open --search "in:title ${titel}" --json number --jq '.[0].number')
          if [ -n "$bestaand" ]; then
            gh issue comment "$bestaand" --body-file "$melding"
            echo "Melding toegevoegd aan issue $bestaand"
          else
            gh issue create --title "$titel" --body-file "$melding"
          fi
      - name: Bewaar het rapport en de back-up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broncontrole
          retention-days: 30
          path: |
            data/import/broncontrole.md
            data/import/broncontrole-browser.md
            data/import/voedingswaarden/broncontrole.md
            data/import/voedingswaarden/broncontrole-browser.md
            data/import/voedingswaarden/plausibiliteit.md
            data/backup/**
