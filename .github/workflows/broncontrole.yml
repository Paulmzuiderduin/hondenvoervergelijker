name: Broncontrole

# Kijkt één keer per week of de bronpagina's van de geïmporteerde etiketten nog
# dezelfde tekst tonen. Verandert er iets, dan komt er een melding in een issue.
# De teksten op de site veranderen nooit vanzelf: een mens beslist wat er gebeurt.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: broncontrole
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bronpagina's vergelijken met de importbestanden
        id: vergelijken
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BRONCONTROLE_TOKEN: ${{ secrets.BRONCONTROLE_TOKEN }}
        run: node scripts/controleer-bronnen.mjs --parallel=6 --pauze=1500
      - name: Geblokkeerde sites in een echte browser controleren
        id: browser
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BRONCONTROLE_TOKEN: ${{ secrets.BRONCONTROLE_TOKEN }}
        run: node scripts/controleer-bronnen-browser.mjs --parallel=3 --pauze=2000
      - name: Melding maken of bijwerken
        if: steps.vergelijken.outcome == 'failure' || steps.browser.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Broncontrole vindt gewijzigde of onbereikbare bronpagina"
          melding=melding.md
          {
            if [ -f data/import/broncontrole.md ]; then
              sed '/^Onveranderd:/,$d' data/import/broncontrole.md
            fi
            if [ -f data/import/broncontrole-browser.md ]; then
              echo ''
              cat data/import/broncontrole-browser.md
            fi
            echo ''
            echo '---'
            echo "Actielog: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ''
            echo 'De tekst op de site is niet veranderd. Kijk per product of de fabrikant het etiket'
            echo 'heeft aangepast; pas daarna de import of het product in Beheer aan.'
          } > "$melding"
          bestaand=$(gh issue list --state open --search "in:title ${titel}" --json number --jq '.[0].number')
          if [ -n "$bestaand" ]; then
            gh issue comment "$bestaand" --body-file "$melding"
            echo "Melding toegevoegd aan issue $bestaand"
          else
            gh issue create --title "$titel" --body-file "$melding"
          fi
      - name: Bewaar het rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broncontrole
          path: |
            data/import/broncontrole.md
            data/import/broncontrole-browser.md
