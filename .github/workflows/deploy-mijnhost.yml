name: Deploy naar mijn.host

# Alleen handmatig starten. Zo blijft de bestaande GitHub Pages-deploy werken
# tot je definitief overstapt en de DNS hebt omgezet.
#
# Benodigde repository-secrets:
#   FTP_SERVER        bijv. ftp.mijn.host of het serveradres uit het paneel
#   FTP_USERNAME      de FTP-gebruiker van het hostingpakket
#   FTP_PASSWORD      het wachtwoord van die FTP-gebruiker
#   FTP_SERVER_DIR    de map die de webroot is, bijv. /public_html/ (optioneel)
#
# De secrets VITE_SUPABASE_URL en VITE_SUPABASE_PUBLISHABLE_KEY bestaan al.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mijnhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Site bouwen
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Serverconfiguratie toevoegen
        run: cp deploy/mijnhost/.htaccess dist/.htaccess
      - name: Controleren of de sitemap klopt
        run: node scripts/controleer-sitemap.mjs --basis=https://hondenvoervergelijker.paulzuiderduin.com
      - name: Uploaden via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
