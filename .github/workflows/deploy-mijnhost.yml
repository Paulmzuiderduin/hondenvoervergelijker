name: Deploy naar mijn.host

# Elke push naar main gaat automatisch naar de live site op mijn.host.
# Handmatig starten kan ook, bijvoorbeeld na een storing of voor een test.
#
# Benodigde repository-secrets:
#   FTP_SERVER        h25.mijn.host
#   FTP_USERNAME      deploy@hondenvoervergelijker.paulzuiderduin.com
#   FTP_PASSWORD      wachtwoord van die FTP-gebruiker
#   FTP_SERVER_DIR    ./ (de FTP-gebruiker staat al in public_html)
#
# De secrets VITE_SUPABASE_URL en VITE_SUPABASE_PUBLISHABLE_KEY bestaan al.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mijnhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Site bouwen
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Serverconfiguratie toevoegen
        run: cp deploy/mijnhost/.htaccess dist/.htaccess
      - name: Uploaden via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
      # Controleer eerst de server zelf (zonder DNS-cache), daarna de publieke
      # site. Zo merken we een verkeerde upload én een verkeerde DNS-stand.
      - name: Controleer de upload op de server
        env:
          DOMEIN: hondenvoervergelijker.paulzuiderduin.com
        run: |
          IP=$(getent ahostsv4 h25.mijn.host | awk '{print $1}' | head -1)
          if [ -z "$IP" ]; then
            IP=$(getent hosts h25.mijn.host | awk '/^[0-9]+\./ {print $1; exit}')
          fi
          echo "Server-IP: $IP"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$DOMEIN:443:$IP" "https://$DOMEIN/")
          echo "HTTPS $CODE voor https://$DOMEIN/ via $IP"
          test "$CODE" = "200"
      - name: Controleer alle sitemap-URL's
        run: node scripts/controleer-sitemap.mjs --basis=https://hondenvoervergelijker.paulzuiderduin.com
      - name: Rooktest van de live site
        run: node scripts/controleer-site.mjs --basis=https://hondenvoervergelijker.paulzuiderduin.com
      - name: Meld URL's bij IndexNow (Bing)
        continue-on-error: true
        run: node scripts/indexnow.mjs
