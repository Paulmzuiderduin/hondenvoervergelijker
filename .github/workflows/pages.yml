name: Deploy GitHub Pages (terugvaloptie)

# De live site draait op mijn.host. Deze workflow staat alleen nog klaar als
# terugvaloptie en start daarom niet meer automatisch. Voor een terugrol zet je
# de DNS weer naar GitHub Pages en start je deze workflow handmatig.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      # Controleert of elke pagina uit de sitemap echt bestaat voordat we URL's
      # bij zoekmachines melden.
      - name: Sitemap-URL's controleren
        run: node scripts/controleer-sitemap.mjs
      # Gratis aanvulling op de sitemap: meldt de URL's bij IndexNow, dat Bing
      # en andere deelnemers gebruiken. Google leest de sitemap in Search Console.
      # De site moet live staan voordat dit draait, anders faalt de sleutelcheck.
      - name: Meld URL's bij IndexNow (Bing)
        continue-on-error: true
        run: node scripts/indexnow.mjs
